<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>栏贯验 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">栏贯验</h1>
      <div class="骨">已汇总缓冲与汇总账报文数互证；影子归档不计正式，误充正式即撕裂。</div>
    </header>

    <div class="禁混条" id="禁混条" style="margin-bottom:10px"></div>
    <section class="卷">
      <div id="快照卡" class="只读框 淡底 圆角8 垫8 侧注">读取贯验快照…</div>
    </section>
    <section class="卷">
      <div class="工具"><button class="按钮" id="跑">跑栏贯验</button> <span id="果"></span></div>
      <div class="表绕"><table><thead><tr><th>时刻</th><th>在栏</th><th>正式汇总报文</th><th>影子归档报文</th><th>坏点</th><th>结果</th><th>说明</th></tr></thead><tbody id="表"></tbody></table></div>
    </section>
    <script>
    async function 刷快照() {
      const s = await 探栏.getJSON("/api/栏贯验/快照");
      document.getElementById("快照卡").innerHTML =
        `正式汇总报文 ${s["汇总报文"]} · 影子归档报文 ${s["影子归档报文"] ?? 0} · 已汇总缓冲 ${s["已汇总缓冲"]} · 在栏 ${s["在栏"]} · 坏点 ${s["坏点"]} · ` +
        (s["是否对齐"] ? 探栏.徽章("对齐","好") : 探栏.徽章("撕裂","危")) +
        `<div class="上距8">${探栏.安全文本(s["说明"] || "")}</div>`;
    }
    async function 刷() {
      const rows = await 探栏.getJSON("/api/栏贯验");
      const tb = document.getElementById("表"); tb.innerHTML = "";
      if (!rows.length) { tb.innerHTML = `<tr><td colspan="7">${探栏.空态("尚无贯验记录。")}</td></tr>`; }
      for (const r of rows) {
        const ok = r.是否对齐 ? 探栏.徽章("对齐","好") : 探栏.徽章("撕裂","危");
        tb.appendChild(探栏.行(`<td>${探栏.安全文本(r.时刻)}</td><td>${r.在栏笔数}</td><td>${r.汇总报文数}</td><td>${r.影子归档报文 ?? 0}</td><td>${r.坏点笔数}</td><td>${ok}</td><td>${探栏.安全文本(r.说明)}</td>`));
      }
    }
    document.getElementById("跑").onclick = async () => {
      const d = await 探栏.postJSON("/api/栏贯验/跑");
      document.getElementById("果").innerHTML = d.是否对齐 ? 探栏.徽章("对齐","好") : 探栏.徽章("撕裂","危");
      await 刷(); await 刷快照();
    };
    刷(); 刷快照();
    </script>

  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" >入栏缓冲</a>
    <a href="/站点汇总账.html" >站点汇总账</a>
    <a href="/坏点匣.html" >坏点匣</a>
    <a href="/栏贯验.html" class="亮">栏贯验</a>
    <a href="/站点源.html" >站点源</a>
    <a href="/栏规.html" >栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
      探栏.渲染禁混条(document.getElementById("禁混条"));
    } catch (e) {}
  })();
  </script>
</body>
</html>
