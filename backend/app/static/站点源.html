<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>站点源 · 探栏</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
  <div class="壳">
    <header class="顶牌">
      <h1>探栏</h1>
      <div class="骨">传感报文装载 → 标定/质控门槛入栏 → 站点汇总物化 → 坏点旁路 → 栏账互证<br/>皮：环境监测传感站 · 不是潮切关窗，也不是对拍双轨</div>
    </header>
    <div class="门槛条" id="门槛条"></div>
    <header class="顶牌" style="margin-bottom:10px">
      <h1 style="font-size:22px">站点源</h1>
      <div class="骨">传感站登记目录；钉本站（锚站）后，结栏禁混，异站片拒拼或进影子归档。</div>
    </header>

    <div class="禁混条" id="禁混条" style="margin-bottom:10px"></div>
    <section class="卷">
      <div class="工具">
        <select id="选站" class="焦点环"></select>
        <button class="按钮 青" id="换站">钉为本站（锚站）</button>
        <span id="回执" class="侧注"></span>
      </div>
      <div class="表绕"><table><thead><tr><th>源键</th><th>名称</th><th>介质</th><th>区域</th><th>说明</th><th>站界</th></tr></thead><tbody id="表"></tbody></table></div>
    </section>
    <script>
    (async () => {
      const [rows, 规, 预览] = await Promise.all([
        探栏.getJSON("/api/站点源"),
        探栏.getJSON("/api/栏规"),
        探栏.getJSON("/api/结栏/预览").catch(() => ({})),
      ]);
      const 锚 = 规["锚站"] || 预览["锚站"] || "";
      const 选 = document.getElementById("选站");
      const tb = document.getElementById("表");
      for (const r of rows) {
        const opt = document.createElement("option");
        opt.value = r.源键; opt.textContent = `${r.源键} · ${r.名称}`;
        选.appendChild(opt);
        const 界 = r.源键 === 锚 ? 探栏.徽章("本站", "ok") : 探栏.徽章("可作异站", "warn");
        tb.appendChild(探栏.行(`<td>${探栏.安全文本(r.源键)}</td><td>${探栏.安全文本(r.名称)}</td><td>${探栏.安全文本(r.介质)}</td><td>${探栏.安全文本(r.区域)}</td><td>${探栏.安全文本(r.说明)}</td><td>${界}</td>`));
      }
      if (锚) 选.value = 锚;
      document.getElementById("换站").onclick = async () => {
        const el = document.getElementById("回执");
        try {
          const d = await 探栏.postJSON("/api/站界/换站", { 锚站: 选.value });
          el.textContent = `已钉本站：${d.锚站}`;
          await 探栏.渲染禁混条(document.getElementById("禁混条"));
        } catch (e) { el.textContent = String(e); }
      };
    })();
    </script>

  </div>

  <nav class="底栏"><div class="底栏内">
    <a href="/" >探栏台</a>
    <a href="/报文流.html" >报文流</a>
    <a href="/入栏缓冲.html" >入栏缓冲</a>
    <a href="/站点汇总账.html" >站点汇总账</a>
    <a href="/坏点匣.html" >坏点匣</a>
    <a href="/栏贯验.html" >栏贯验</a>
    <a href="/站点源.html" class="亮">站点源</a>
    <a href="/栏规.html" >栏规</a>
  </div></nav>

  <script>
  (async () => {
    try {
      const o = await 探栏.getJSON("/api/概览");
      探栏.渲染门槛(document.getElementById("门槛条"), o.栏规 || {});
      探栏.渲染禁混条(document.getElementById("禁混条"));
    } catch (e) {}
  })();
  </script>
</body>
</html>
